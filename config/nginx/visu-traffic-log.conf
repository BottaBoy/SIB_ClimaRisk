map $http_cf_connecting_ip $visu_visitor_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

log_format visu_traffic_json escape=json
    '{"time":"$time_iso8601",'
    '"host":"$host",'
    '"request":"$request",'
    '"status":$status,'
    '"remote_addr":"$remote_addr",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"visitor_ip":"$visu_visitor_ip",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"}';
